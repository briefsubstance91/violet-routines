<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Violet's Life OS</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* ── Option C · Companion of the Day ────────────────────────────────────
       One big character who changes with the clock — morning, afternoon and
       night each get their own friend, backdrop and line of encouragement. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple: #9b87f5; --pink: #f472b6; --blue: #4db8ff;
      --text: #1e1b4b; --muted: #9490c0; --card: #fff;
      --sky1: #cce8ff; --sky2: #e9e3ff; --sky3: #ffd6f0; --ink: #1e1b4b;
    }
    html, body {
      min-height: 100%; font-family: 'Nunito', sans-serif; color: var(--text);
      background: linear-gradient(160deg, var(--sky1) 0%, var(--sky2) 52%, var(--sky3) 100%);
      background-attachment: fixed; -webkit-tap-highlight-color: transparent;
      transition: background 0.6s ease;
    }
    /* Evening flips the page dark; the same markup, a different mood. */
    body.night { --ink: #ffffff; --muted: #b9b4e0; color: #fff; }
    body.night .panel { background: rgba(255,255,255,0.1); backdrop-filter: blur(8px); }
    body.night .rail-item { background: rgba(255,255,255,0.12); color: #fff; }
    body.night .rail-name { color: #fff; }

    .wrap { max-width: 1180px; margin: 0 auto; padding: 0.9rem 1rem 2rem; }
    .menu-btn { position: absolute; top: 0.9rem; right: 1rem; background: rgba(255,255,255,0.82); border: none;
      font-size: 1.3rem; color: var(--purple); cursor: pointer; padding: 0.35rem 0.65rem; border-radius: 12px;
      line-height: 1; box-shadow: 0 4px 16px rgba(78,58,180,0.12); z-index: 5; }

    /* ── Hero: companion + greeting + today strip ── */
    .hero { display: grid; gap: 1rem; align-items: center; grid-template-columns: 1fr; margin-bottom: 0.85rem; }
    @media (min-width: 820px) { .hero { grid-template-columns: 1.1fr 0.9fr; } }
    .hero-copy { min-width: 0; }
    .greet { font-size: 0.74rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
    h1 { font-family: 'Fredoka One', cursive; font-weight: 400; font-size: clamp(1.8rem, 4vw, 2.6rem); line-height: 1.05;
      background: linear-gradient(135deg, #4db8ff, #9b87f5, #f472b6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin: 0.15rem 0; }
    body.night h1 { background: linear-gradient(135deg, #a8d8ff, #e9d5ff, #fbcfe8);
      -webkit-background-clip: text; background-clip: text; }
    .date { font-size: 0.82rem; font-weight: 700; color: var(--muted); }
    .say {
      display: inline-block; position: relative; margin-top: 0.9rem;
      background: var(--card); border-radius: 18px; padding: 0.7rem 1rem;
      font-size: 0.92rem; font-weight: 800; color: var(--ink);
      box-shadow: 0 8px 24px rgba(78,58,180,0.14); max-width: 22rem;
    }
    body.night .say { background: rgba(255,255,255,0.14); }
    .say::after { content: ''; position: absolute; left: 26px; bottom: -9px;
      border: 10px solid transparent; border-top-color: var(--card); border-bottom: 0; }
    body.night .say::after { border-top-color: rgba(255,255,255,0.14); }

    .companion { display: flex; justify-content: center; }
    /* One fixed card size for every companion — the artwork ranges from square
       to tall portrait, and an unconstrained portrait pushes the page down. */
    .companion img { width: min(340px, 66vw); height: clamp(200px, 32vh, 300px);
      border-radius: 26px; object-fit: cover;
      box-shadow: 0 16px 40px rgba(78,58,180,0.22); }

    /* ── Today strip ── */
    .today { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.7rem; margin-bottom: 0.85rem; }
    @media (min-width: 700px) { .today { grid-template-columns: repeat(4, 1fr); } }
    .panel { background: var(--card); border-radius: 18px; padding: 0.75rem 0.9rem;
      box-shadow: 0 8px 24px rgba(78,58,180,0.1); display: flex; align-items: center; gap: 0.7rem;
      text-decoration: none; color: inherit; }
    .panel-icon { font-size: 1.5rem; flex-shrink: 0; }
    .panel-big { display: block; font-family: 'Fredoka One', cursive; font-size: 1.35rem; line-height: 1.05; color: var(--ink); }
    .panel-lbl { display: block; font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-top: 0.15rem; }
    .panel.go { background: linear-gradient(135deg, #9b87f5, #f472b6); color: white; }
    .panel.go .panel-big, .panel.go .panel-lbl { color: white; }

    /* ── Character tiles ──
       Four across at most, so each friend is big enough to recognise from
       across the kitchen — seven in a row made them postage stamps. */
    .rail { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.8rem; }
    @media (min-width: 560px) { .rail { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 900px) { .rail { grid-template-columns: repeat(4, 1fr); } }
    .rail-item { background: var(--card); border-radius: 22px; padding: 1.1rem 0.6rem 1rem;
      display: flex; flex-direction: column; align-items: center; gap: 0.5rem; text-align: center;
      text-decoration: none; color: var(--text); box-shadow: 0 8px 24px rgba(78,58,180,0.12);
      border: none; font-family: inherit; cursor: pointer; width: 100%; transition: transform 0.16s ease; }
    .rail-item:active { transform: scale(0.96); }
    .rail-item img { width: min(124px, 34vw); height: min(124px, 34vw); object-fit: contain; }
    .rail-name { font-size: 1rem; font-weight: 800; color: var(--text); line-height: 1.15; }
    .rail-item.on { background: #dcfce7; }

    /* ── Menu ── */
    .menu-backdrop { display: none; position: fixed; inset: 0; background: rgba(78,58,180,0.18); z-index: 200; backdrop-filter: blur(2px); }
    .menu-backdrop.open { display: block; }
    .menu-panel { position: fixed; top: 0; right: 0; width: min(280px, 85vw); height: 100%; background: white; z-index: 201; transform: translateX(110%); transition: transform 0.3s cubic-bezier(0.34,1.2,0.64,1); padding: 2rem 1.5rem; display: flex; flex-direction: column; box-shadow: -8px 0 40px rgba(78,58,180,0.15); color: #1e1b4b; overflow-y: auto; }
    .menu-panel.open { transform: translateX(0); }
    .menu-title { font-family: 'Fredoka One', cursive; font-size: 1.4rem; background: linear-gradient(135deg, #4db8ff, #9b87f5, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 1.75rem; }
    .menu-item { display: flex; align-items: center; gap: 0.9rem; padding: 0.95rem 0.5rem; border-bottom: 1.5px solid #f3f0ff; font-size: 0.95rem; font-weight: 700; color: #1e1b4b; border-radius: 8px; }
    .menu-item a { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 0.9rem; width: 100%; }
    .menu-item-icon { font-size: 1.3rem; width: 28px; text-align: center; }
  </style>
</head>
<body>
<div class="wrap">
  <button class="menu-btn" onclick="openMenu()">☰</button>

  <div class="hero">
    <div class="hero-copy">
      <div class="greet" id="heroGreeting">Hello</div>
      <h1>Violet's Life OS ✦</h1>
      <div class="date" id="todayDate"></div>
      <div class="say" id="companionSay">Ready when you are.</div>
    </div>
    <div class="companion"><img id="companionImg" src="/static/misc%20images/IMG_6645.JPG" alt=""></div>
  </div>

  <div class="today">
    <a class="panel go" href="/routines">
      <span class="panel-icon">✦</span>
      <span>
        <span class="panel-big" id="nextRoutine">Routines</span>
        <span class="panel-lbl" id="nextRoutineWhen">tap to start</span>
      </span>
    </a>
    <div class="panel" id="weatherCard" style="visibility:hidden">
      <span class="panel-icon" id="wcIcon">⛅</span>
      <span>
        <span class="panel-big" id="wcTemp">–°</span>
        <span class="panel-lbl"><span id="wcCond">—</span> · <span id="wcHilo"></span></span>
      </span>
    </div>
    <a class="panel" href="/stats" id="heroStreak" style="display:none">
      <span class="panel-icon">🌟</span>
      <span>
        <span class="panel-big" id="streakVal">0</span>
        <span class="panel-lbl">days completed</span>
      </span>
    </a>
    <a class="panel" href="/bank">
      <span class="panel-icon">🏦</span>
      <span>
        <span class="panel-big">Bank</span>
        <span class="panel-lbl">what you've earned</span>
      </span>
    </a>
  </div>

  <div class="rail">
    <a class="rail-item" href="/stats"><img src="/static/badges/cinnamoroll-cherries.png" alt=""><span class="rail-name">Stats</span></a>
    <a class="rail-item" href="/badges"><img src="/static/badges/pompompurin-pancakes.png" alt=""><span class="rail-name">Badges</span></a>
    <a class="rail-item" href="/routines"><img src="/static/badges/kuromi-leopard.png" alt=""><span class="rail-name">Level Up</span></a>
    <a class="rail-item" href="/charities"><img src="/static/badges/mymelody-wave.png" alt=""><span class="rail-name">Giving</span></a>
    <a class="rail-item" href="/calendar"><img src="/static/badges/cinnamoroll-beret.png" alt=""><span class="rail-name">Calendar</span></a>
    <button class="rail-item" id="bellCard" onclick="toggleNotifications()">
      <img src="/static/badges/gudetama.png" alt="">
      <span class="rail-name"><span id="bellIcon">🔕</span> <span id="bellName">Reminders</span></span>
      <span hidden id="bellDesc"></span>
    </button>
    <a class="rail-item" href="/dashboard"><img src="/static/badges/cinnamoroll-parfait.png" alt=""><span class="rail-name">Grown-ups</span></a>
  </div>
</div>

{% include '_home_core.html' %}
<script>
  // The companion, the backdrop and the line all follow the clock. PART comes
  // from the shared core, so this stays in step with the greeting.
  const COMPANIONS = {
    morning:   { img: '/static/misc%20images/IMG_6645.JPG',
                 say: "Morning! Let's get the first one done ☁️",
                 sky: ['#cce8ff', '#e9e3ff', '#ffe9f6'], routine: 'Morning Routine', when: 'first thing' },
    afternoon: { img: '/static/misc%20images/IMG_6646.JPG',
                 say: 'Halfway there — one thing at a time 🌸',
                 sky: ['#ffe3f1', '#ede9fe', '#dbeafe'], routine: 'Afternoon Routine', when: 'after school' },
    evening:   { img: '/static/misc%20images/9551b75a02e4430f05c8241b465bdfdb.jpg',
                 say: 'Wind-down time. You did a lot today 🌙',
                 sky: ['#1e1b4b', '#3b2f7a', '#6d4a8f'], routine: 'Evening Routine', when: 'before bed' },
  };
  (function () {
    const c = COMPANIONS[PART];
    $('companionImg').src = c.img;
    setText('companionSay', c.say);
    setText('nextRoutine', c.routine);
    setText('nextRoutineWhen', c.when);
    document.documentElement.style.setProperty('--sky1', c.sky[0]);
    document.documentElement.style.setProperty('--sky2', c.sky[1]);
    document.documentElement.style.setProperty('--sky3', c.sky[2]);
    document.body.classList.toggle('night', PART === 'evening');
  })();
</script>
</body>
</html>
